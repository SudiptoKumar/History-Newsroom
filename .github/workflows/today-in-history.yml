name: Today in History

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Batch to publish"
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "1"

permissions:
  contents: write

concurrency:
  group: today-in-history
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL || '@HistoryNewsroom' }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: gpt-oss-120b
      USE_CEREBRAS: "true"
      USE_EXA_CONTEXT: "true"
      TIMEZONE: Asia/Dhaka
      MAX_EVENTS_PER_DAY: "20"
      BATCH_SIZE: "10"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify Python source
        run: python -m py_compile main.py *.py

      - name: Run self-test
        run: pytest -q

      - name: Select scheduled batch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BATCH_INDEX="${{ inputs.batch_index }}"
          elif [[ "${{ github.event.schedule }}" == "0 2 * * *" ]]; then
            BATCH_INDEX="1"
          elif [[ "${{ github.event.schedule }}" == "0 11 * * *" ]]; then
            BATCH_INDEX="2"
          else
            echo "Unsupported schedule: ${{ github.event.schedule }}"
            exit 1
          fi

          if [[ "$BATCH_INDEX" != "1" && "$BATCH_INDEX" != "2" ]]; then
            echo "Invalid BATCH_INDEX=$BATCH_INDEX. Only batch 1 or 2 is allowed."
            exit 1
          fi

          echo "BATCH_INDEX=$BATCH_INDEX" >> "$GITHUB_ENV"
          echo "Selected batch: $BATCH_INDEX"

      - name: Publish Today in History
        run: python main.py --batch "$BATCH_INDEX"

      - name: Save state
        if: always()
        run: |
          git config user.name "Today in History Bot"
          git config user.email "actions@github.com"
          git add -A state/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Today in History state"
            git push
          fi
